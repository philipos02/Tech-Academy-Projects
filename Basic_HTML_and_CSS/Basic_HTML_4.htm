<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
.My_Style {
background-color: red;
color :blue;
text-decoration: underline;
font-weight: bold;
font-size: small;
}
</style>

</head>
<body>

<h2 class="My_style"> This h2 element is styled per class attribute My_Style</h2>
<h3 class="My_Style"> This h3 elemt is styled per class attribute My_Style</h3>
<h4 class="My_Style">Even though this is an h4 element,it is styled the same as the 
h2 element because we pointed to the class attribute My_Style class</h4>
<p class="My_style"> This paragraph is written in my style!</p>
</body>
</html>
